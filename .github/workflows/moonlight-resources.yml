name: Moonlight resource kit

on:
  workflow_dispatch:
  push:
    branches: ['build/moonlight-resource-kit']
    paths:
      - '.github/workflows/moonlight-resources.yml'
      - 'scripts/export_moonlight_resources.py'

permissions:
  contents: read

jobs:
  resources:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned upstream Moonlight
        uses: actions/checkout@v4
        with:
          repository: moonlight-stream/moonlight-ios
          ref: 02dc9780496eeeac6d01c8bbdccb8b6fe71ef28a
          submodules: recursive
          path: upstream
      - name: Build upstream resources with Xcode
        run: |
          xcodebuild -version
          xcodebuild -project upstream/Moonlight.xcodeproj -scheme Moonlight \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MoonlightDerived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
      - name: Export resources and generated model code only
        run: |
          python3 scripts/export_moonlight_resources.py \
            --source upstream --derived "$RUNNER_TEMP/MoonlightDerived" --output "$RUNNER_TEMP/resource-kit"
          tar -czf "$RUNNER_TEMP/moonlight-resource-kit.tar.gz" -C "$RUNNER_TEMP/resource-kit" .
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-resource-kit-02dc978
          path: ${{ runner.temp }}/moonlight-resource-kit.tar.gz
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-resource-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
